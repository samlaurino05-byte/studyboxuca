<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StudyBox UCA | Mobile</title>
<style>
:root{
  --navy:#071b3d;--navy2:#0b2a5c;--blue:#2563eb;--text:#071831;--muted:#667085;--line:#e2e8f0;
  --libre:#16a34a;--ocupado:#ef4444;--reservado:#f59e0b;--mesa:#7c3aed;--bg:#f5f7fb;
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.header{background:linear-gradient(135deg,var(--navy),#082b63);color:white;padding:18px 16px 20px;border-radius:0 0 24px 24px;box-shadow:0 12px 30px #071b3d30;position:sticky;top:0;z-index:20}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:14px;background:white;color:var(--navy);display:grid;place-items:center;font-weight:950;font-size:20px}h1{font-size:23px;line-height:1;margin:0;font-weight:950;letter-spacing:-.5px}.subtitle{margin:4px 0 0;color:#d8e6f8;font-size:13px}.live{background:#ffffff18;border:1px solid #ffffff25;border-radius:14px;padding:8px 10px;text-align:right;font-size:12px;white-space:nowrap}.live b{display:block}.live span{color:#86efac;font-weight:900}.filters{display:flex;gap:8px;overflow-x:auto;padding-top:16px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{border:1px solid #ffffff28;background:#ffffff12;color:white;padding:10px 14px;border-radius:999px;font-weight:800;white-space:nowrap}.filter.active{background:white;color:var(--navy)}
.app{width:min(1160px,100%);margin:auto;padding:16px}.hero{background:white;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 12px 28px #0f172a0d;margin-bottom:14px}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.sectionTitle h2{margin:0;font-size:20px;letter-spacing:-.3px}.legend{display:flex;gap:10px;flex-wrap:wrap;color:#475467;font-size:13px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px}.d-libre{background:var(--libre)}.d-reservado{background:var(--reservado)}.d-ocupado{background:var(--ocupado)}.d-mesa{background:var(--mesa)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}.map{background:#fbfcfe;border:1px solid var(--line);border-radius:18px;padding:12px}.gridMap{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:104px;gap:10px}.space{border:2px solid var(--line);border-radius:14px;background:white;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:.18s;box-shadow:0 8px 18px #0f172a0a}.space:hover{transform:translateY(-2px)}.space.selected{outline:4px solid #93c5fd}.space strong{font-size:16px}.space small{font-weight:900;margin-top:5px}.space.libre{border-color:var(--libre);background:linear-gradient(135deg,#fff,#f0fdf4)}.space.ocupado{border-color:var(--ocupado);background:linear-gradient(135deg,#fff,#fee2e2)}.space.reservado{border-color:var(--reservado);background:linear-gradient(135deg,#fff,#fff7ed)}.space.mesa{border-color:var(--mesa);background:linear-gradient(135deg,#fff,#f3e8ff)}.space.libre small{color:var(--libre)}.space.ocupado small{color:#dc2626}.space.reservado small{color:#d97706}.space.mesa small{color:var(--mesa)}.wide{grid-column:span 2}.tall{grid-row:span 2}.service{background:#f1f5f9;border:1px dashed #cbd5e1;color:#334155;cursor:default}.service:hover{transform:none}
.side{display:flex;flex-direction:column;gap:14px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 12px 28px #0f172a0d}.detailHead{display:flex;align-items:center;gap:12px;margin-bottom:14px}.icon{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);display:grid;place-items:center;color:white;font-size:23px}.detailHead h3{margin:0;font-size:23px;letter-spacing:-.4px}.row{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid #edf2f7;padding:12px 0;font-size:15px}.row strong{text-align:right}.stateLibre{color:var(--libre)}.stateOcupado{color:#dc2626}.stateReservado{color:#d97706}.formLabel{font-size:15px;margin:14px 0 8px;color:#344054}select{width:100%;padding:14px;border:1px solid #d8e1ec;border-radius:13px;background:white;color:var(--text);font-size:15px}.reserve{width:100%;margin-top:12px;border:0;border-radius:13px;padding:15px;background:var(--blue);color:white;font-weight:900;font-size:15px;box-shadow:0 10px 22px #2563eb30}.reserve:disabled{background:#94a3b8;box-shadow:none}.reservation{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:10px}.reservation strong{display:block}.reservation span{font-size:13px;color:#475467}.qr{font-weight:950;background:#f1f5f9;border-radius:10px;padding:9px 10px}.adminBtn{position:fixed;right:18px;bottom:18px;border:0;border-radius:999px;background:var(--blue);color:white;padding:14px 16px;font-weight:900;box-shadow:0 12px 30px #2563eb45}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111827;color:white;padding:13px 16px;border-radius:999px;display:none;z-index:50;font-size:14px}.toast.show{display:block}
.mobileList{display:none}.spaceList{display:grid;gap:10px}.spaceItem{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:16px;background:white;padding:14px;box-shadow:0 8px 18px #0f172a08}.spaceItem .left{display:flex;align-items:center;gap:12px}.badge{width:12px;height:44px;border-radius:999px}.spaceItem strong{display:block}.spaceItem span{font-size:13px;color:#475467}.pill{font-size:12px;font-weight:950;border-radius:999px;padding:7px 9px}.pill.libre{background:#dcfce7;color:#166534}.pill.ocupado{background:#fee2e2;color:#991b1b}.pill.reservado{background:#ffedd5;color:#9a3412}.pill.mesa{background:#ede9fe;color:#5b21b6}
@media(max-width:850px){
  body{background:#f6f8fb}.app{padding:12px}.header{padding:14px 14px 16px;border-radius:0 0 22px 22px}.logo{width:42px;height:42px;font-size:18px}h1{font-size:21px}.subtitle{font-size:12px}.live{font-size:11px;padding:7px 9px}.layout{display:block}.hero{padding:14px;border-radius:18px}.desktopMap{display:none}.mobileList{display:block}.side{margin-top:12px}.sectionTitle{display:block}.sectionTitle h2{font-size:19px;margin-bottom:8px}.legend{font-size:12px}.card{padding:16px;border-radius:18px}.detailHead h3{font-size:21px}.adminBtn{display:none}.filters{padding-top:13px}.filter{padding:9px 12px;font-size:13px}.reservation{padding:12px}.row{font-size:14px}.reserve{position:sticky;bottom:10px;z-index:10}
}
@media(max-width:420px){.live{display:none}.brand{gap:10px}.header{padding-left:12px;padding-right:12px}.app{padding:10px}.spaceItem{padding:12px}.detailHead{align-items:flex-start}.icon{width:42px;height:42px;border-radius:14px}.row{padding:10px 0}.card{padding:14px}}
</style>
</head>
<body>
<header class="header">
  <div class="top">
    <div class="brand"><div class="logo">SB</div><div><h1>StudyBox UCA</h1><p class="subtitle">Reservá tu espacio de estudio</p></div></div>
    <div class="live"><b id="clock">--:--</b><span>● en vivo</span></div>
  </div>
  <div class="filters">
    <button class="filter active" data-filter="todos">Todos</button>
    <button class="filter" data-filter="libre">Libres</button>
    <button class="filter" data-filter="reservado">Reservados</button>
    <button class="filter" data-filter="ocupado">Ocupados</button>
    <button class="filter" data-filter="mesa">Mesas</button>
  </div>
</header>

<main class="app">
  <div class="layout">
    <section class="hero">
      <div class="sectionTitle">
        <h2>Biblioteca subsuelo</h2>
        <div class="legend"><span><i class="dot d-libre"></i>Libre</span><span><i class="dot d-reservado"></i>Reservado</span><span><i class="dot d-ocupado"></i>Ocupado</span><span><i class="dot d-mesa"></i>Mesas</span></div>
      </div>

      <div class="map desktopMap">
        <div class="gridMap" id="desktopMap"></div>
      </div>

      <div class="mobileList">
        <div class="spaceList" id="mobileList"></div>
      </div>
    </section>

    <aside class="side">
      <section class="card" id="detailCard"></section>
      <section class="card">
        <div class="sectionTitle"><h2>Próximas reservas</h2></div>
        <div class="reservation"><div><strong>Box 5</strong><span>Reservado para 18:00</span></div><div class="qr">QR</div></div>
        <div class="reservation"><div><strong>Box 4</strong><span>Reservado para 17:00</span></div><div class="qr">QR</div></div>
        <div class="reservation"><div><strong>Mesas grupales C</strong><span>Reservado para 16:30</span></div><div class="qr">QR</div></div>
      </section>
    </aside>
  </div>
</main>

<button class="adminBtn" onclick="alert('Panel admin oculto en mobile. En versión desktop se podría activar.')">Panel admin</button>
<div class="toast" id="toast">Reserva creada correctamente</div>

<script>
const spaces = [
  {id:1,name:'Box 1',type:'Box individual',status:'libre',cap:'4 personas',note:'Zona silenciosa'},
  {id:2,name:'Box 2',type:'Box individual',status:'ocupado',cap:'4 personas',note:'En uso'},
  {id:3,name:'Box 3',type:'Box individual',status:'libre',cap:'4 personas',note:'Zona silenciosa'},
  {id:4,name:'Mesas individuales A',type:'Mesa abierta',status:'mesa',cap:'12 personas',note:'Zona silenciosa',wide:true},
  {id:5,name:'Box 5',type:'Box individual',status:'reservado',cap:'4 personas',note:'Reservado hasta 18:00'},
  {id:10,name:'Box 10',type:'Box individual',status:'libre',cap:'4 personas',note:'Cerca del acceso'},
  {id:'bath',name:'Baños',service:true},
  {id:'stairs',name:'Escalera',service:true},
  {id:'empty1',name:'Área común',service:true},
  {id:6,name:'Box 6',type:'Box individual',status:'libre',cap:'4 personas',note:'Zona lateral'},
  {id:'empty2',name:'Área común',service:true},
  {id:11,name:'Mesas grupales B',type:'Mesa grupal',status:'mesa',cap:'10 personas',note:'Ideal para trabajos prácticos',wide:true},
  {id:12,name:'Mesas grupales C',type:'Mesa grupal',status:'reservado',cap:'10 personas',note:'Reservado para 16:30',wide:true},
  {id:4,name:'Box 4',type:'Box individual',status:'reservado',cap:'4 personas',note:'Reservado para 17:00'},
  {id:7,name:'Box 7',type:'Box individual',status:'ocupado',cap:'4 personas',note:'En uso'}
];
let selected = spaces.find(s=>!s.service && s.name==='Mesas individuales A');
let currentFilter = 'todos';

function statusText(s){return s==='libre'?'Libre':s==='ocupado'?'Ocupado':s==='reservado'?'Reservado':'Mesas'}
function filtered(){return spaces.filter(s => s.service || currentFilter==='todos' || s.status===currentFilter)}

function render(){
  const desktop = document.getElementById('desktopMap');
  const mobile = document.getElementById('mobileList');
  desktop.innerHTML = '';
  mobile.innerHTML = '';
  filtered().forEach(s=>{
    if(s.service){
      const div=document.createElement('div');div.className='space service';div.innerHTML=`<strong>${s.name}</strong>`;desktop.appendChild(div);return;
    }
    const d=document.createElement('button');
    d.className=`space ${s.status} ${s.wide?'wide':''} ${selected.id===s.id&&selected.name===s.name?'selected':''}`;
    d.innerHTML=`<strong>${s.name}</strong><small>${statusText(s.status)}</small>`;
    d.onclick=()=>selectSpace(s);desktop.appendChild(d);

    const item=document.createElement('button');
    item.className='spaceItem';
    item.onclick=()=>selectSpace(s);
    item.innerHTML=`<div class="left"><i class="badge" style="background:var(--${s.status==='mesa'?'mesa':s.status})"></i><div><strong>${s.name}</strong><span>${s.type} · ${s.cap}</span></div></div><div class="pill ${s.status}">${statusText(s.status)}</div>`;
    mobile.appendChild(item);
  });
  renderDetail();
}
function selectSpace(s){selected=s;render();document.getElementById('detailCard').scrollIntoView({behavior:'smooth',block:'nearest'});} 
function renderDetail(){
  const cls = selected.status==='libre'?'stateLibre':selected.status==='ocupado'?'stateOcupado':'stateReservado';
  const canReserve = selected.status==='libre' || selected.status==='mesa';
  document.getElementById('detailCard').innerHTML = `
    <div class="detailHead"><div class="icon">${selected.status==='mesa'?'▦':'□'}</div><div><h3>${selected.name}</h3><span style="color:#667085;font-size:14px">Detalle del espacio</span></div></div>
    <div class="row"><span>Estado</span><strong class="${cls}">${statusText(selected.status)}</strong></div>
    <div class="row"><span>Capacidad</span><strong>${selected.cap}</strong></div>
    <div class="row"><span>Tipo</span><strong>${selected.type}</strong></div>
    <div class="row"><span>Nota</span><strong>${selected.note}</strong></div>
    <div class="formLabel">Reservar horario</div>
    <select id="hour"><option>15:00</option><option>16:00</option><option selected>17:00</option><option>18:00</option><option>19:00</option></select>
    <button class="reserve" ${canReserve?'':'disabled'} onclick="reserveSpace()">${canReserve?'Reservar este espacio':'No disponible'}</button>`;
}
function reserveSpace(){
  const toast=document.getElementById('toast');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800);
  selected.status='reservado';selected.note='Reservado para '+document.getElementById('hour').value;render();
}
document.querySelectorAll('.filter').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentFilter=btn.dataset.filter;render();});
function clock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});}clock();setInterval(clock,30000);render();
</script>
</body>
</html>
